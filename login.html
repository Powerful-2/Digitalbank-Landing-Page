<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digitalbank</title>
    <!-- 1. Base Styles (All screens/Mobile) -->
    <link rel="stylesheet" href="style.css">
    <!-- Tablet Styles (loads at 768px and up) -->
    <link rel="stylesheet" href="tablets.css" media="screen and (min-width: 768px)">
    <!-- 3. Desktop Styles (Active on screens 1440px and wider) -->
    <link rel="stylesheet" href="desktop.css" media="screen and (min-width: 1440px)">
    <!-- <link href="https://fonts.googleapis.com" rel="stylesheet"> -->
    <!-- Paste these exactly into your HTML <head> to fix line 13 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;700&display=swap" rel="stylesheet">

</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="./images/logo-dark.svg" alt="">
            </div>
    
            <nav class="mobile-menu" id="mobile-menu">
                <ul class="navigation">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="careers.html">Careers</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
    
            <!-- <form action="/invite" method="post">
              <button type="submit" class="request-invite-btn">Request Invite</button>
            </form> -->
            <!-- Add id="inviteBtn" so your JavaScript can find it -->
            <button type="button" class="request-invite-btn" id="inviteBtn">Request Invite</button>
    
    
            <!-- The Hamburger Button -->
            <button type="button" class="dropdown-toggle" aria-label="Toggle Menu" aria-expanded="false"
                aria-controls="mobile-menu">
                <span class="hamburger-bar bar-1"></span>
                <span class="hamburger-bar bar-2"></span>
                <span class="hamburger-bar bar-3"></span>
            </button>
        </div>
        <div class="overlay" id="overlay"></div>
    </header>
    <main class="login-container">
        <div class="login-header">
            <h1>Digital Bank</h1>
            <p>Login to your account</p>
        </div>
        
        <!-- Login Form-->
        <form action="LoginForm">

            <!-- Email Input Group-->
            <div class="form-group">
                <label for="LoginEmail">Email Address</label>
                <input type="email" id="LoginEmail"
                placeholder="Enter your email" required autocomplete="email">
            </div>

            <!--Password Input Group-->
            <div class="form-group">
                <label for="LoginPassword">Password</label>
                <input type="password" id="LoginPassword"
                placeholder="Enter your password" 
                required 
                autocomplete="current-password">
            </div>

            <button class="submit" class="submit-btn">Login</button>
        </form>

        <div id="LoginMessage"></div>

        <!--FOOTER SECTION-->
        <div class="login-footer">
            <p>Don't have an account?</p>
            <a href="signup.html">Sign up here</a>
            <p style="margin-top: 10px; font-size: 12px; color: #999;">Demo: john@gmail.com / password123</p>
        </div>
    </main>
</body>

<script src="login.html"></script>
</html>
