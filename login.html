    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tablets.css" media="(min-width:768px)">
    <link rel="stylesheet" href="desktop.css" media="(min-width:1440px)">
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="./images/logo-dark.svg" alt="Digitalbank Logo">
            </div>
    
            <!-- Correctly configured mobile drawer tracking class -->
            <nav class="mobile-menu" id="mobile-menu">
                <ul class="navigation">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="careers.html">Careers</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
    
            <button type="button" class="request-invite-btn" id="inviteBtn">Request Invite</button>
    
            <!-- The Hamburger Button with Explicit Class and ID Hooks -->
            <button type="button" class="dropdown-toggle" id="dropdown-toggle" aria-label="Toggle Menu" aria-expanded="false"
                aria-controls="mobile-menu">
                <span class="hamburger-bar bar-1"></span>
                <span class="hamburger-bar bar-2"></span>
                <span class="hamburger-bar bar-3"></span>
            </button>
        </div>
    
        <!-- The missing visual shadow overlay layer container -->
        <div class="overlay" id="overlay"></div>
    </header>


    <main id="main-content">
        <section class="login-container" aria-labelledby="login-title">
            <header class="login-header">
                <h1 id="login-title">Welcome Back</h1>
                <p>Sign in to your DigitalBank account.</p>
            </header>

            <form id="loginForm" action="#">
                <div class="form-group">
                    <label for="LoginEmail">Email Address</label>
                    <input type="email" id="LoginEmail" placeholder="Enter your email" required autocomplete="email">
                </div>
            
                <div class="form-group">
                    <label for="LoginPassword">Password</label>
                    <input type="password" id="LoginPassword" placeholder="Enter your password" required
                        autocomplete="current-password">
                </div>
            
                <button type="submit" class="submit-btn">Login</button>
            </form>

            <div id="loginMessage"></div>
            <!-- <div id="login-message" aria-live="polite"></div> -->

            <footer class="login-footer">
                <p>Don't have an account?</p>
                <a href="signup.html">Create one here</a>

                <p class="demo-credentials">Demo Account: john@gmail.com / password123</p>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
