<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="./images/logo-dark.svg" alt="Digitalbank Logo">
            </div>
            <nav class="mobile-menu" id="mobile-menu">
                <ul class="navigation">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="careers.html">Careers</a></li>
                    <li><a href="login.html">Login Portal</a></li>
                </ul>
            </nav>

            <button type="button" class="request-invite-btn" id="inviteBtn">Request Invite</button>

            <!-- The Hamburger Button -->
            <button type="button" class="dropdown-toggle" aria-label="Toggle Menu" aria-expanded="false"
                aria-controls="mobile-menu">
                <span class="hamburger-bar bar-1"></span>
                <span class="hamburger-bar bar-2"></span>
                <span class="hamburger-bar bar-3"></span>
            </button>
        </div>
        <div class="overlay" id="overlay"></div>
    </header>

    <main class="page-content-wrapper">
        <section class="contact section container">
            <div class="contact__header">
                <h1>Get In Touch</h1>
                <p>Have a question? <br>We’d love to hear from you.</p>
            </div>
            <form class="contact__form" id="contactForm" novalidate>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="user_name" placeholder="Enter your name" autocomplete="name">
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="user_email" placeholder="Enter your email" autocomplete="email">
                    <span class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="user_message" placeholder="How can we help?" rows="5"></textarea>
                    <span class="error-message"></span>
                </div>
                <button type="submit" class="request-invite-btn" id="submitBtn">Request Invite</button>
            </form>
        </section>
    </main>

    <!-- FIXED: Pointing correctly to script.js (Removed the 's') -->
    <script src="script.js"></script>
</body>
</html>
